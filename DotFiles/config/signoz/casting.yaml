# SigNoz, self-hosted on Colima (local only). Input for SigNoz's Foundry
# generator, which turns it into Docker Compose files: obs_forge (zsh,
# 64-observability.zsh) runs foundryctl in a throwaway container, from a
# pinned image, and writes them to ~/.local/share/signoz/pours/.
#
# Every image is pinned by digest (the components rule). Foundry's defaults
# use :latest, which for the collector was a release candidate. To upgrade,
# change the tag AND digest together:
#   docker pull <image>:<tag>
#   docker image inspect <image>:<tag> --format '{{index .RepoDigests 0}}'
# then run obs_forge && obs_start.
#
# Telemetry to SigNoz is off: the stats reporter (on by default; it also
# collects user emails) and Segment analytics.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  signoz:
    spec:
      image: signoz/signoz:v0.149.0@sha256:dc31f487d69452b90da87cf7208b334963de776349b3c2b661bf88990edf9ca4
      env:
        SIGNOZ_STATSREPORTER_ENABLED: "false"
        SIGNOZ_ANALYTICS_ENABLED: "false"
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.15@sha256:3996e0ffc58bc86d433062a45ef7ff960a4768da0619944f651a17254d634daf
  metastore:
    kind: postgres
    spec:
      image: postgres:16.15@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
  telemetrystore:
    spec:
      image: clickhouse/clickhouse-server:25.12.5@sha256:cacf32d6884291dc2ff5e0156a97f46fc53ff7c929a7906d114e268a929dfd3a
  telemetrykeeper:
    spec:
      image: clickhouse/clickhouse-keeper:25.12.5@sha256:525b8b0f93ccb371131c46f22a066ea43d33d74aba314203e8044609945d8524
  # The UI on 18080 instead of 8080 (8080 is a common dev-server port). JSON
  # Patch on the generated compose: `test` first, so forging fails loudly if a
  # future Foundry lays the ports out differently. OTLP stays on 4317/4318.
  # obs_* reads the port back from the generated compose.
  patches:
    - target: deployment/compose.yaml
      operations:
        - op: test
          path: /services/signoz-signoz-0/ports/0
          value: "8080:8080"
        - op: replace
          path: /services/signoz-signoz-0/ports/0
          value: "18080:8080"
