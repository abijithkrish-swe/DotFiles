#Place in ~/.tmux.conf
set -g default-terminal "screen-256color"

# Use vi keys in copy mode (h/j/k/l, w, b, etc.)
setw -g mode-keys vi

set -g mouse on
set -sg escape-time 0
set -g history-limit 10000

# Status bar: simple, readable
set -g status-bg black
set -g status-fg white
set -g status-left '#[bold,cyan]#S '
set -g status-right '#[green]%H:%M %d-%b-%y'

