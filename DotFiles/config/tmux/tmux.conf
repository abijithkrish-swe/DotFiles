# ~/.tmux.conf (minimal, clean, refined)

##### Terminal & colors
set -g default-terminal "tmux-256color"
#set -as terminal-overrides ',*:Tc'   # truecolor support
set -g focus-events on

##### Keys & behavior
set -sg escape-time 0
setw -g mode-keys vi
set -g mouse on
set -g history-limit 100000

# Window/pane numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1
# No gaps after closing a window (1 2 3 → close 2 → 1 2)
set -g renumber-windows on

##### Status line
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left-length 30
set -g window-status-separator ''

# Session pill: blue normally, turns yellow while the prefix (C-b) is waiting for a key
set -g status-left '#{?client_prefix,#[bg=colour220],#[bg=colour39]}#[fg=colour16,bold] #S #[default] '

# Other windows: grey; the last one (-) a little brighter; flags kept so you can still read them
set -g window-status-format ' #I:#W#{?window_flags,#{window_flags}, } '
set -g window-status-style 'fg=colour244'
set -g window-status-last-style 'fg=colour252'
set -g window-status-activity-style 'fg=colour214,bold'

# Current window: a solid green pill, Z shown when a pane is zoomed
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, Z,} '
set -g window-status-current-style 'bg=colour113,fg=colour16,bold'

# Right: an orange COPY badge while the pane is in copy mode, then the clock
set -g status-right '#{?pane_in_mode,#[bg=colour208 fg=colour16 bold] COPY #[default] ,}#[fg=colour244]%H:%M %d-%b-%y '

##### Splits (same keys as default, but inherit working dir)
unbind '"'
unbind %
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
# New windows too
bind c new-window -c "#{pane_current_path}"

##### Resize (optional, simple)
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2

##### Sessions
# tmux's default "last session" key is L, which the resize set above uses.
bind Tab switch-client -l

##### Copy mode (vi keys)
#   Prefix [    → enter copy mode
#   v / Space   → begin selection
#   y / Enter   → copy & exit
#   mouse drag  → copy, stay in copy mode where you were
#   q           → cancel/exit
# Copies go to the macOS clipboard
set -s copy-command 'pbcopy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe

##### QoL
# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# Toggle sync panes
bind S set -w synchronize-panes \; display-message 'sync-panes: #{?pane_synchronized,on,off}'
