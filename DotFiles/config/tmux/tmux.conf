# ~/.tmux.conf (minimal, clean, refined)

##### Terminal & colors
set -g default-terminal "tmux-256color"
#set -as terminal-overrides ',*:Tc'   # truecolor support
set -g focus-events on

##### Keys & behavior
set -sg escape-time 0
setw -g mode-keys vi
set -g mouse on
set -g history-limit 100000

# Window/pane numbering starts at 1
set -g base-index 1
setw -g pane-base-index 1

##### Status line
set -g status-bg black
set -g status-fg white
set -g status-left '#[bold,cyan]#S '
set -g status-right '#[green]%H:%M %d-%b-%y'

##### Splits (same keys as default, but inherit working dir)
unbind '"'
unbind %
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

##### Resize (optional, simple)
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2

##### Copy mode (defaults preserved)
#   Prefix [    → enter copy mode
#   Space       → begin selection
#   Enter       → copy & exit
#   q           → cancel/exit

##### QoL
# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'

# Toggle sync panes
bind S set -w synchronize-panes \; display-message 'sync-panes: #{?pane_synchronized,on,off}'
