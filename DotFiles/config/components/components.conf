# components.conf — the approved list of developer components.
#
# Agents (via the toolshelf MCP server) and, later, the zsh use_* helpers
# only see what is listed here. A folder under ~/Components that is not listed
# does not exist to them. Design & runbooks: Docs/AgentComponents.md
#
# Deployed to ~/.config/components/components.conf by `install_copy.sh deploy`.
# The MCP server re-reads this file on every call — no rebuild needed.

# ---- tool definitions ---------------------------------------------------
# @tool <name> dir=<folder under ~/Components> [key=value ...]
#   root=   tool home inside the version folder; `|` = candidates, first that
#           exists wins (default: .)
#   bin=    bin dir relative to root; `|` = candidates (default: bin)
#   check=  binary that must exist in bin for a version to count as healthy
#   home=   env vars set to the tool home, comma-separated (optional)

@tool jdk       dir=JDK       root=Contents/Home|.  check=java      home=JAVA_HOME
@tool maven     dir=Maven     check=mvn             home=M2_HOME,MAVEN_HOME
@tool gradle    dir=Gradle    check=gradle          home=GRADLE_HOME
@tool ant       dir=Ant       check=ant             home=ANT_HOME
@tool node      dir=Node      check=node
# pnpm: the standalone binary from github.com/pnpm/pnpm/releases, unpacked so
# bin/ holds both `pnpm` and its `dist/` (pnpm looks for dist next to itself).
@tool pnpm      dir=Pnpm      check=pnpm
@tool go        dir=GO        check=go              home=GOROOT
@tool python    dir=Python    check=python3
@tool protobuf  dir=Protobuf  check=protoc
@tool redis     dir=Redis     bin=src|bin           check=redis-server
@tool mysql     dir=Mysql     bin=Core/bin          check=mysql          home=MYSQL_HOME
# Rust: install with the standalone installer into ~/Components/Rust/<ver>
# (./install.sh --prefix=~/Components/Rust/<ver>), not rustup — rustup
# self-updates toolchains, which defeats the approved list.
@tool rust      dir=Rust      check=cargo

# ---- approved versions --------------------------------------------------
# <tool> <version> [default] [autoload | onpath] [docker=<image>@sha256:<digest>]
#   default   picked when a version is omitted (at most one per tool)
#   autoload  activated on interactive login (use_<tool>: PATH + env, status)
#   onpath    only its bin dir is put on PATH at login, e.g. a client for
#             remote servers; nothing is activated or started
#   docker=   pinned Linux image for docker mode — digest only, never a bare tag
#             (Maven/Gradle images include their JDK: Maven + Gradle 8 = 17, Gradle 9 = 25)

jdk       11        default autoload  docker=eclipse-temurin:11-jdk@sha256:ac08dd7a5082b18cdd4e88bd70a2098f32d523f2ab127b7e9b6295271e810873
